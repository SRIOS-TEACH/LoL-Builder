<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Explorer | LoL Buildsmith</title>
<link rel="stylesheet" href="CSS/foundation.css">
<link rel="stylesheet" href="CSS/lolBuilder.css">
</head>
<body class="dark-mode">
<div class="page-wrapper with-navbar">
<nav class="navbar">
<a href="main.html" class="navbar-brand">LoL Buildsmith</a>
<ul class="navbar-nav site-nav">
<li class="nav-item ">
<a href="main.html" class="nav-link" >Home</a>
</li>
<li class="nav-item ">
<a href="Builder.html" class="nav-link" >Builder</a>
</li>
<li class="nav-item ">
<a href="champ.html" class="nav-link" >Champion Explorer</a>
</li>
<li class="nav-item active">
<a href="itemLookup.html" class="nav-link" aria-current="page">Item Explorer</a>
</li>
<li class="nav-item ">
<a href="Comparator.html" class="nav-link" >Build Comparator</a>
</li>
</ul>
</nav>
<main class="content-wrapper">
<div class="container-fluid explorer-page">
<h1>Item Explorer</h1>
<section class="section-card explorer-controls">
<label for="itemSearch">Search items</label>
<input id="itemSearch" class="form-control" type="search" placeholder="Item name">
<h2>Maps</h2>
<div id="mapFilters">
</div>
<details>
<summary>Stat and item filters</summary>
<div id="itemFilters">
</div>
</details>
<p id="itemCount" role="status">
</p>
</section>
<div class="explorer-columns">
<section class="section-card">
<div id="itemGrid" class="item-grid">
</div>
</section>
<section class="section-card">
<img id="itemIcon" class="item-icon" alt="Selected item" hidden>
<h2 id="itemName">No item selected</h2>
<div id="itemCost">
</div>
<div id="itemMeta">
</div>
<div id="combatInputs">
</div>
<div id="itemTooltipMain">Choose an item to inspect its stats and effects.</div>
</section>
</div>
</div>
</main>
</div>







<script type="module" src="JS/itemExplorer.js"></script></body>
</html>
