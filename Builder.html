<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Sandbox</title>
  <link href="CSS/halfmoon-variables.css" rel="stylesheet">
  <link href="CSS/lolBuilder.css" rel="stylesheet">
</head>
<body class="dark-mode compact-dashboard">
  <div class="page-wrapper with-navbar with-transitions">
    <nav class="navbar">
      <a href="main.html" class="navbar-brand">LoL Build Builder</a>
      <ul class="navbar-nav d-none d-md-flex">
        <li class="nav-item"><a href="main.html" class="nav-link">Home</a></li>
        <li class="nav-item active"><a href="Builder.html" class="nav-link">Builder</a></li>
        <li class="nav-item"><a href="itemLookup.html" class="nav-link">Item Lookup</a></li>
        <li class="nav-item"><a href="champ.html" class="nav-link">Champion Lookup</a></li>
      </ul>
    </nav>

    <div class="content-wrapper">
      <main class="container-fluid builder-dashboard">
        <header id="builderHeroCard" class="dashboard-toolbar section-card">
          <div id="selectedChampionBadge" class="selected-champion-badge">
            <button id="championPickerBtn" class="champion-picker-icon-btn" type="button" aria-label="Select champion">+</button>
            <div><strong id="dashboardChampionName">Select champion</strong><small id="dashboardChampionTitle"></small></div>
          </div>
          <label class="champ-level-control toolbar-level">Level <select id="builderLevel" class="form-control"></select></label>
          <div class="toolbar-build"><span class="dashboard-label">Items</span><div id="itemSlots" class="item-slots item-slots-icons"></div></div>
          <label class="toolbar-skin">Skin<select id="skinSelector" class="form-control" disabled><option>Original</option></select></label>
          <button id="passiveToggleBtn" class="btn btn-sm" type="button">Item passives</button>
          <p id="builderStatus" class="status-text" role="status"></p>
        </header>
        <aside class="dashboard-left">
          <section class="section-card dashboard-panel"><h2>Champion stats</h2><div id="statsTable" class="stats-table-wrap"></div></section>
          <section id="runesCard" class="section-card dashboard-panel rune-panel"><h2>Selected runes</h2><div id="runePanel" class="rune-panel-grid"></div></section>
        </aside>
        <section class="dashboard-center"><div class="dashboard-heading"><h2>Abilities</h2><small id="abilityRuleHint" class="text-muted"></small></div><div id="abilityCards" class="ability-grid ability-layout"></div></section>
        <aside class="dashboard-right">
          <section id="attackSummary" aria-label="Attack results"></section>
          <section class="section-card dashboard-panel target-panel"><h2>Target &amp; attack settings</h2><p class="target-hint text-muted">Select a champion to configure combat conditions.</p><div id="combatInputs" class="combat-inputs"></div><div id="attackSettings"></div></section>
        </aside>
      </main>
    </div>
  </div>

  <div id="itemModal" class="item-modal hidden shop-modal" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle">
    <div class="item-modal-body item-modal-wide picker-shell">
      <div class="item-modal-header"><h3 id="itemModalTitle">Select Item</h3><button id="closeItemModalBtn" class="btn btn-sm" type="button" aria-label="Close item picker">Close ×</button></div>
      <div class="shop-toolbar"><div class="shop-tabs"><button id="allItemsTab" class="btn btn-sm" type="button" aria-pressed="true">All items</button><button id="recommendedItemsTab" class="btn btn-sm" type="button" aria-pressed="false" hidden>Recommended</button></div><input id="modalItemSearch" class="form-control" placeholder="Search items" aria-label="Search items" autocomplete="off" /><button id="clearModalFiltersBtn" class="btn btn-sm" type="button">Clear filters</button></div>
      <div class="shop-layout">
        <div id="modalItemFilters" class="shop-filter-rail" aria-label="Item filters"></div>
        <section class="picker-results"><p id="modalResultsCount" class="text-muted"></p><div id="modalItemGrid" class="item-icon-grid shop-item-grid" tabindex="0" aria-label="Items"></div></section>
        <aside id="modalItemDetail" class="item-detail-panel picker-detail" aria-label="Item details"></aside>
      </div>
    </div>
  </div>

  <div id="champModal" class="item-modal hidden" role="dialog" aria-modal="true" aria-labelledby="champPickerTitle">
    <div class="item-modal-body item-modal-wide champ-modal-body picker-shell">
      <div class="item-modal-header"><h3 id="champPickerTitle">Select Champion</h3><button id="closeChampModalBtn" class="btn btn-sm" type="button" aria-label="Close champion picker">Close ×</button></div>
      <div class="champ-modal-toolbar"><input id="modalChampSearch" class="form-control" placeholder="Search champions" aria-label="Search champions" autocomplete="off"/><div id="modalChampFilters" class="tag-filters champ-filter-row"></div></div>
      <div class="champ-picker-layout">
        <section class="picker-results"><p id="modalChampResults" class="text-muted"></p><div id="modalChampGrid" class="item-icon-grid champ-icon-grid" tabindex="0" aria-label="Champions"></div></section>
        <aside id="modalChampDetail" class="item-detail-panel picker-detail" aria-label="Champion details"></aside>
      </div>
    </div>
  </div>

  <div id="runeModal" class="item-modal hidden" role="dialog" aria-modal="true">
    <div class="item-modal-body rune-modal-body">
      <div class="item-modal-header">
        <h3 id="runeModalTitle">Select Rune</h3>
        <button id="closeRuneModalBtn" class="btn btn-sm" type="button">Close</button>
      </div>
      <div id="runeModalList" class="rune-option-list"></div>
    </div>
  </div>

  <div id="passiveModal" class="item-modal hidden" role="dialog" aria-modal="true">
    <div class="item-modal-body rune-modal-body">
      <div class="item-modal-header">
        <h3>Detected Passives</h3>
        <button id="closePassiveModalBtn" class="btn btn-sm" type="button">Close</button>
      </div>
      <div id="passiveModalList" class="passive-modal-list"></div>
    </div>
  </div>

  <script src="JS/shared/apiClient.js"></script>
  <script src="JS/shared/itemPolicy.js"></script>
  <script src="JS/shared/abilityRules.js"></script>
  <script src="JS/shared/abilityDps.js"></script>
  <script src="JS/shared/buildStats.js"></script>
  <script src="JS/shared/calculations.js"></script>
  <script src="JS/shared/combatInputs.js"></script>
  <script src="JS/shared/championEffects.js"></script>
  <script src="JS/shared/attackEffects.js"></script>
  <script src="JS/shared/attackChampions.js"></script>
  <script src="JS/shared/itemData.js"></script>
  <script src="JS/builder.js"></script>
</body>
</html>
