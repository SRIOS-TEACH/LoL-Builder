name: Deploy production and refactor preview to Pages

on:
  push:
    branches: ["main", "codex/modular-refactor"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Both branches publish one combined artifact, so neither replaces the other site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && github.sha || 'main' }}
          path: _production
      - name: Checkout modular refactor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/codex/modular-refactor' && github.sha || 'codex/modular-refactor' }}
          path: _refactor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and generate production site
        working-directory: _production
        run: |
          if [ -f scripts/build-site.cjs ]; then
            npm test
            npm run build
            npm run verify:release
          fi
      - name: Verify and generate refactor site
        working-directory: _refactor
        run: |
          npm test
          npm run build
      - name: Compose production and refactor preview
        shell: bash
        run: |
          mkdir _site
          git -C _production archive HEAD | tar -x -C _site
          if [ -d _production/dist/preview ]; then
            cp -R _production/dist/preview _site/preview
          fi
          mkdir _site/modular-refactor
          cp -R _refactor/dist/. _site/modular-refactor/
          node _production/scripts/verify-pages.cjs _production _refactor/dist _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4